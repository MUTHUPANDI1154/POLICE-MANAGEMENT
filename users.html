<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TN Police - Registered Users</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(120deg,#082b55,#07559a);
    min-height:100vh;
    color:white;
    padding:30px;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:45px;
}

h1{
    color:#ffd900;
    font-size:30px;
}

h2{
    font-size:20px;
    margin-top:5px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
}

.count{
    background:rgba(255,255,255,.13);
    border:1px solid #6ca5d4;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
}

.count span{
    color:#ffd900;
}

.add{
    background:#079ff0;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:22px;
    font-weight:bold;
}

.add:hover{
    background:#00b5ff;
}

.table-box{
    background:rgba(255,255,255,.13);
    border:1px solid #6ca5d4;
    border-radius:15px;
    padding:15px;
    box-shadow:0 10px 30px #001d3d;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#07559a;
    color:#ffd900;
    padding:13px 10px;
    text-align:center;
    font-size:14px;
}

td{
    padding:11px 10px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.2);
    font-size:13px;
}

tr:hover{
    background:rgba(255,255,255,.08);
}

.btn{
    border:0;
    padding:7px 12px;
    border-radius:15px;
    color:white;
    cursor:pointer;
    font-weight:bold;
    margin:2px;
}

.edit{
    background:#079ff0;
}

.delete{
    background:#e53935;
}

.edit:hover{
    background:#00b5ff;
}

.delete:hover{
    background:#ff5252;
}

.empty{
    text-align:center;
    padding:30px;
    color:#ffeb3b;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    color:#ffd900;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">👮</div>
        <h1>TN Police</h1>
        <h2>Registered Users</h2>
    </div>

    <div class="top">

        <div class="count">
            Total Registered Users:
            <span id="total">0</span>
        </div>

        <a href="register.html" class="add">
            + Add New User
        </a>

    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Full Name</th>
                    <th>Mobile Number</th>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="userTable">
            </tbody>

        </table>

        <div id="empty" class="empty" style="display:none;">
            No registered users found.
        </div>

    </div>

    <div class="footer">
        <a href="register.html">← Back to Create Account</a>
    </div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("tnUsers")) || [];
if (users.length === 0) {
    users = [
        {
            name: "Vignesh Kumar",
            mobile: "9840123456",
            email: "vignesh@gmail.com",
            username: "vignesh",
            password: "password123",
            date: "12/10/2026",
            time: "10:15 AM"
        },
        {
            name: "Ananya Ramesh",
            mobile: "9789012345",
            email: "ananya@gmail.com",
            username: "ananya",
            password: "password123",
            date: "14/10/2026",
            time: "02:30 PM"
        }
    ];
    localStorage.setItem("tnUsers", JSON.stringify(users));
}


function displayUsers(){

    let table=document.getElementById("userTable");
    let total=document.getElementById("total");
    let empty=document.getElementById("empty");

    table.innerHTML="";

    total.innerText=users.length;

    if(users.length===0){

        empty.style.display="block";

        return;

    }else{

        empty.style.display="none";

    }

    users.forEach(function(user,index){

        let row=table.insertRow();

        row.innerHTML=`

            <td>${index+1}</td>

            <td>${user.name}</td>

            <td>${user.mobile}</td>

            <td>${user.email}</td>

            <td>${user.username}</td>

            <td>${user.password}</td>

            <td>${user.date}</td>

            <td>${user.time}</td>

            <td>
                <button class="btn edit"
                    onclick="editUser(${index})">
                    Edit
                </button>

                <button class="btn delete"
                    onclick="deleteUser(${index})">
                    Delete
                </button>
            </td>

        `;

    });

}


function deleteUser(index){

    if(confirm("Are you sure you want to delete this user?")){

        users.splice(index,1);

        localStorage.setItem(
            "tnUsers",
            JSON.stringify(users)
        );

        displayUsers();

    }

}


function editUser(index){

    let user=users[index];

    let name=prompt("Enter Full Name:",user.name);

    if(name===null) return;

    let mobile=prompt(
        "Enter Mobile Number:",
        user.mobile
    );

    if(mobile===null) return;

    let email=prompt(
        "Enter Email:",
        user.email
    );

    if(email===null) return;

    let username=prompt(
        "Enter Username:",
        user.username
    );

    if(username===null) return;

    let password=prompt(
        "Enter Password:",
        user.password
    );

    if(password===null) return;

    user.name=name.trim();
    user.mobile=mobile.trim();
    user.email=email.trim();
    user.username=username.trim();
    user.password=password;

    localStorage.setItem(
        "tnUsers",
        JSON.stringify(users)
    );

    displayUsers();

}


displayUsers();

</script>

</body>
</html>
